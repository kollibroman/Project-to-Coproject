<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="552" viewBox="0 0 1024 552" font-family="'Liberation Sans', Arial, Helvetica, sans-serif">
  <defs>
    <filter id="shadowMd" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1024" height="552" fill="#ffffff"/>

  <!-- Górny pasek (AppShell.Header) -->
  <line x1="0" y1="60.5" x2="1024" y2="60.5" stroke="#dee2e6"/>
  <g stroke="#212529" stroke-width="2">
    <line x1="18" y1="23" x2="36" y2="23"/>
    <line x1="18" y1="29" x2="36" y2="29"/>
    <line x1="18" y1="35" x2="36" y2="35"/>
  </g>
  <text x="52" y="37.5" font-size="22" font-weight="700" fill="#212529">ProjectCowork</text>
  <g transform="translate(888 20)" fill="none" stroke="#228be6" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M2.5 15 C3.5 13.5 3.5 11 3.5 8.5 a5.5 5.5 0 0 1 11 0 c0 2.5 0 5 1 6.5 Z"/>
    <path d="M6.5 17.5 a2.5 2.5 0 0 0 5 0"/>
  </g>
  <circle cx="909" cy="18" r="8" fill="#fa5252"/>
  <text x="909" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="967" y="35" font-size="14" font-weight="700" fill="#228be6" text-anchor="middle">Wyloguj</text>

  <!-- Boczne menu (AppShell.Navbar), aktywna pozycja „Odkryj” -->
  <line x1="260.5" y1="61" x2="260.5" y2="552" stroke="#dee2e6"/>
  <text x="28" y="100" font-size="14" fill="#212529">Pulpit</text>
  <rect x="16" y="114" width="228" height="38" fill="#e7f5ff"/>
  <text x="28" y="138" font-size="14" fill="#228be6">Odkryj</text>
  <text x="28" y="176" font-size="14" fill="#212529">Konto</text>
  <text x="16" y="531" font-size="12" fill="#868e96">v0.0.0</text>

  <!-- Nagłówek strony -->
  <text x="284" y="114" font-size="34" font-weight="700" fill="#212529">System rezerwacji sal</text>
  <rect x="284" y="132" width="142" height="20" rx="10" fill="#e7f5ff"/>
  <text x="355" y="146" font-size="11" font-weight="700" fill="#228be6" text-anchor="middle">PODGLĄD PROJEKTU</text>

  <g filter="url(#shadowMd)">
    <rect x="284.5" y="176.5" width="717" height="132" rx="4" fill="#ffffff" stroke="#dee2e6"/>
    <rect x="284.5" y="328.5" width="717" height="200" rx="4" fill="#ffffff" stroke="#dee2e6"/>
  </g>

  <!-- Opis projektu -->
  <text x="316" y="224" font-size="22" font-weight="700" fill="#212529">Opis projektu</text>
  <text x="316" y="256" font-size="14" fill="#868e96">Aplikacja webowa do rezerwacji sal wykładowych na uczelni.</text>
  <text x="316" y="276" font-size="14" fill="#868e96">Integracja z kalendarzem uczelni i powiadomienia e-mail.</text>

  <!-- Dane kontaktowe -->
  <text x="316" y="376" font-size="22" font-weight="700" fill="#212529">Dane kontaktowe</text>

  <rect x="316" y="398" width="40" height="40" rx="8" fill="#e7f5ff"/>
  <g transform="translate(325 407)" fill="none" stroke="#228be6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <rect x="1" y="4" width="20" height="14" rx="1.5"/>
    <path d="M1 5 L11 12 L21 5"/>
  </g>
  <text x="372" y="414" font-size="12" fill="#868e96">E-mail</text>
  <text x="372" y="433" font-size="14" fill="#228be6">kontakt@rezerwacje-sal.pl</text>

  <rect x="316" y="458" width="40" height="40" rx="8" fill="#e7f5ff"/>
  <g transform="translate(325 467)" fill="none" stroke="#228be6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M6 2 L9 7 L7 9 a12 12 0 0 0 6 6 L15 13 L20 16 L18 20 C9 20 2 13 2 4 Z"/>
  </g>
  <text x="372" y="474" font-size="12" fill="#868e96">Telefon</text>
  <text x="372" y="493" font-size="14" fill="#228be6">+48 512 345 678</text>
